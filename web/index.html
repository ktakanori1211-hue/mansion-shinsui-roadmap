<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マンション浸水ロードマップ</title>
  <link rel="stylesheet" href="start.css">
</head>
<body>
  <!-- 画面は1本（2026-11-05 一本化）。1画面に、図1枚・太字1行・ボタン1つ。
       絵は構内平面図だけ。判定はサーバーの決まりのまま（/api/building の equipment）。この画面は新しい判定を作らない。 -->
  <header class="top">
    <a class="brand" href="/">マンション浸水ロードマップ</a>
    <span class="top-links">
      <a class="sources-link" href="/sources.html">根拠と資料</a>
      <button type="button" class="key-toggle" id="key-toggle" hidden>設定</button>
    </span>
  </header>
  <form class="key-form" id="key-form" autocomplete="off" hidden>
    <label for="key-input">Claude の APIキー</label>
    <input id="key-input" type="password" autocomplete="new-password" spellcheck="false" placeholder="ここに貼り付ける">
    <button type="submit">保存</button>
    <p class="hint" id="key-note" role="status">このパソコンのホームのファイル（権限600）にだけ保存し、画面にもログにも出しません。</p>
  </form>

  <nav class="steps" id="steps" aria-label="4つの画面">
    <button type="button" data-go="1"><b>1</b>場所</button>
    <button type="button" data-go="2" disabled><b>2</b>確かめる</button>
    <button type="button" data-go="3" disabled><b>3</b>止まるもの</button>
    <button type="button" data-go="4" disabled><b>4</b>渡す</button>
  </nav>

  <main class="screen" id="screen" aria-live="polite"></main>

  <!-- 固定の免責。畳まず、言い換えず、どの画面でも出す。 -->
  <footer class="fixed-note">
    <p id="fixed-disclaimer">本シートは公開データと入力情報から作成したもので、現地の判定や安全を保証するものではない。浸水中は電気室・借室（東京電力の変圧器の部屋）・ポンプ室・EVピットに立ち入らず、復電の可否は電気主任技術者が判断する</p>
  </footer>

  <!-- 質問する（チャット）。押したときだけ開く。浸水・停電中の危険な場所への立入・操作・接触は、サーバーが AI を通さず固定の文で答える。 -->
  <button type="button" class="chat-toggle" id="chat-toggle">質問する</button>
  <aside class="chat" id="chat" aria-label="質問する" hidden>
    <div class="chat-head">
      <strong>質問する</strong>
      <button type="button" id="chat-close">閉じる</button>
    </div>
    <p class="chat-fixed">本シートは公開データと入力情報から作成したもので、現地の判定や安全を保証するものではない。浸水中は電気室・借室（東京電力の変圧器の部屋）・ポンプ室・EVピットに立ち入らず、復電の可否は電気主任技術者が判断する。予報ではありません。</p>
    <p class="chat-route" id="chat-route" aria-live="polite"></p>
    <div class="chat-log" id="chat-log" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" type="text" autocomplete="off" aria-label="質問" placeholder="例：ケーブルを通す壁の穴ってどういうこと？">
      <button type="submit">送る</button>
    </form>
  </aside>

  <!-- 印刷だけに出す紙（依頼メモ・理事会A4（縦1枚）・費用と補助）。 -->
  <section class="print-memo" id="print-memo" aria-hidden="true"></section>

  <script src="cad.js"></script>
  <script src="start.js"></script>
</body>
</html>
